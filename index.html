/* Layout: an outdoor-catalog grid — stark white product tiles, huge condensed uppercase headlines,
   black pill buttons — with Liquid Glass chrome (floating header, tab bar, sheets, controls) over a soft forest-and-sun backdrop. */
:root{
  --bg:#F3F1ED; --surface:#FFFFFF; --tile:#FFFFFF; --ink:#0B0B0C; --muted:#625E57; --line:rgba(12,11,10,.10);
  --accent:#0B0B0C; --accent-ink:#FFFFFF; --brand:#FBB03B; --brand-ink:#1A1203; --brand-text:#A3610A; --accent-soft:rgba(251,176,59,.18);
  --tape:#FBB03B; --tape-ink:#1A1203; --danger:#C0271B; --ok:#1C7A47; --check:#E9E6E0;
  --glass:rgba(255,255,255,.46); --glass-hi:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.80);
  --glass-border:rgba(255,255,255,.75); --glass-spec:rgba(255,255,255,.95); --glass-edge:rgba(0,0,0,.06); --glass-shadow:rgba(40,28,10,.14);
  --field:rgba(255,255,255,.66); --blob-a:rgba(251,176,59,.34); --blob-b:rgba(255,214,150,.42); --blob-c:rgba(150,140,128,.20);
  --scrim:rgba(10,14,12,.28); --shadow:0 20px 60px rgba(30,20,6,.18);
  --f-display:"Advercase","Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Advercase","Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --blur:blur(24px) saturate(185%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0908; --surface:#161412; --tile:#1A1816; --ink:#F5F3EF; --muted:#A39E96; --line:rgba(255,255,255,.10);
    --accent:#F5F3EF; --accent-ink:#0B0B0C; --brand:#FBB03B; --brand-ink:#1A1203; --brand-text:#FBB03B; --accent-soft:rgba(251,176,59,.16);
    --tape:#FBB03B; --tape-ink:#1A1203; --danger:#FF8A7A; --ok:#5CCB8E; --check:#221F1C;
    --glass:rgba(30,27,24,.48); --glass-hi:rgba(54,50,45,.55); --glass-strong:rgba(24,22,20,.82);
    --glass-border:rgba(255,255,255,.14); --glass-spec:rgba(255,255,255,.22); --glass-edge:rgba(0,0,0,.5); --glass-shadow:rgba(0,0,0,.45);
    --field:rgba(255,255,255,.06); --blob-a:rgba(251,176,59,.20); --blob-b:rgba(200,110,20,.14); --blob-c:rgba(90,80,70,.20);
    --scrim:rgba(0,0,0,.5); --shadow:0 24px 70px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0908; --surface:#161412; --tile:#1A1816; --ink:#F5F3EF; --muted:#A39E96; --line:rgba(255,255,255,.10);
  --accent:#F5F3EF; --accent-ink:#0B0B0C; --brand:#FBB03B; --brand-ink:#1A1203; --brand-text:#FBB03B; --accent-soft:rgba(251,176,59,.16);
  --tape:#FBB03B; --tape-ink:#1A1203; --danger:#FF8A7A; --ok:#5CCB8E; --check:#221F1C;
  --glass:rgba(30,27,24,.48); --glass-hi:rgba(54,50,45,.55); --glass-strong:rgba(24,22,20,.82);
  --glass-border:rgba(255,255,255,.14); --glass-spec:rgba(255,255,255,.22); --glass-edge:rgba(0,0,0,.5); --glass-shadow:rgba(0,0,0,.45);
  --field:rgba(255,255,255,.06); --blob-a:rgba(251,176,59,.20); --blob-b:rgba(200,110,20,.14); --blob-c:rgba(90,80,70,.20);
  --scrim:rgba(0,0,0,.5); --shadow:0 24px 70px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.backdrop{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60vmax 50vmax at 8% -8%,var(--blob-a),transparent 62%),
  radial-gradient(50vmax 40vmax at 100% 18%,var(--blob-b),transparent 60%),
  radial-gradient(60vmax 50vmax at 40% 110%,var(--blob-c),transparent 65%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}

/* Liquid Glass material */
.top-in,.tabbar,.sheet,.search,select.sel,.chip,.seg,.panel,.kpi,.banner,.finder,.toast,.icon-btn,.btn:not(.primary):not(.confirm):not(.ghost){
  background:linear-gradient(180deg,var(--glass-hi),var(--glass));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 0 var(--glass-spec),inset 0 -1px 1px var(--glass-edge),0 8px 28px var(--glass-shadow);
}
.top-in,.tabbar,.sheet,.panel,.banner{position:relative;isolation:isolate}
.top-in::after,.tabbar::after,.sheet::after,.panel::after,.banner::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 20% -10%,var(--glass-spec),transparent 46%),radial-gradient(80% 60% at 110% 120%,rgba(255,255,255,.10),transparent 60%);opacity:.55}
@media (prefers-reduced-transparency:reduce){
  .top-in,.tabbar,.sheet,.search,select.sel,.chip,.seg,.panel,.kpi,.banner,.finder,.toast,.icon-btn,.btn:not(.primary):not(.confirm):not(.ghost){background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* Header — floating glass bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-block:12px 0}
.top-in{display:flex;align-items:center;gap:18px;padding:8px 8px 8px 20px;border-radius:999px;margin-inline:auto;max-width:1240px}
header.top .gutter{padding:8px 8px 8px 20px}
header.top{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font:800 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.brand .logo{width:28px;height:28px;object-fit:contain;flex:none}
.tabs{display:flex;gap:2px;margin-left:10px}
.tab{border:0;background:none;padding:9px 18px;border-radius:999px;font:700 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);background:linear-gradient(180deg,var(--glass-spec),var(--glass-hi));box-shadow:inset 0 0 0 1px var(--glass-border),0 2px 10px var(--glass-shadow)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 20px;min-height:44px;white-space:nowrap;
  font:700 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;border:1px solid transparent;transition:transform .15s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 22px var(--glass-shadow)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.confirm{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn svg{width:18px;height:18px}
.icon-btn{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;color:var(--ink);padding:0}
.icon-btn svg{width:18px;height:18px}

/* Mobile: floating glass tab bar */
.tabbar{display:none}
.fab{display:none}
@media (max-width:759px){
  .tabs,.top-add{display:none}
  .top-in{padding:6px 6px 6px 18px}
  .tabbar{display:flex;position:fixed;z-index:30;border-radius:30px;padding:6px;gap:4px;
    left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 8px;border-radius:24px;font-size:12px;letter-spacing:.1em}
  .tabbar .tab svg{width:22px;height:22px}
  .fab{display:inline-flex;position:fixed;z-index:31;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));padding:14px 22px}
}

main{padding-block:28px 150px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.view-head h1{font:800 clamp(48px,9vw,96px)/.88 var(--f-display);text-transform:uppercase;letter-spacing:-.01em}
.view-head p{margin:10px 0 0;color:var(--muted);font:600 14px/1.3 var(--f-display);text-transform:uppercase;letter-spacing:.12em}
.store-note{font:500 11px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* Filters */
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:10px;border-radius:999px;padding:0 18px;min-height:48px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;padding:10px 0;font-size:16px}
select.sel{border-radius:999px;padding:10px 16px;min-height:48px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 10px;margin:-4px -2px -10px}
.chips::-webkit-scrollbar{display:none}
.chips{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;cursor:grab;scroll-padding-inline:12px}
@media (pointer:coarse){.chips{scroll-snap-type:x proximity}.chips .chip{scroll-snap-align:start}} /* snap on touch only; a trackpad or mouse scrolls freely */
.chips.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.chips.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px);mask-image:linear-gradient(90deg,transparent,#000 40px)}
.chips.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 48px),transparent)}
.chips.dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}
.chip .x{margin-left:2px;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:15px;line-height:1;opacity:.6}
.chip .x:hover{opacity:1;background:var(--line)}
.chip.add{border-style:dashed}
.type-new{display:flex;gap:8px;margin-top:10px}
.type-new input{flex:1;min-width:0}
.swipe-hint{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-style:normal;margin-left:6px;opacity:.8}
.chip{flex:none;border-radius:999px;padding:8px 15px;font:700 14px/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip .n{font:500 11px var(--f-mono);opacity:.6;letter-spacing:0}
.swatch{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);flex:none}

/* Product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:28px 18px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}}
.card{position:relative;text-align:left;border:0;padding:0;background:none;display:flex;flex-direction:column;gap:12px;min-width:0}
.tile{background:var(--tile);border-radius:var(--r);aspect-ratio:4/5;max-width:100%;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 1px 0 var(--line),0 12px 30px rgba(30,20,6,.06);transition:transform .25s ease,box-shadow .25s ease}
.tile img{width:100%;height:100%;object-fit:contain;padding:11%;transition:transform .35s ease}
.tile.full img{padding:0;object-fit:cover}
.card:hover .tile{transform:translateY(-3px);box-shadow:0 1px 0 var(--line),0 20px 40px rgba(30,20,6,.12)}
.card:hover .tile img{transform:scale(1.04)}
.card.selected .tile{box-shadow:0 0 0 3px var(--brand),0 12px 30px rgba(30,20,6,.10)}
.card.selected::after{content:"✓";position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
.card-meta{padding:0 4px;min-width:0}
.card-name{font-weight:700;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-sub{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.wears{font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.04em}
.badge{position:absolute;top:10px;left:10px;background:var(--tape);color:var(--tape-ink);font:800 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:999px}

.banner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:24px;padding:18px 20px;margin-bottom:24px}
.banner p{margin:0;max-width:62ch}
.banner strong{font:800 18px var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.empty{text-align:center;color:var(--muted);padding:64px 16px;border:1px dashed var(--line);border-radius:24px}
.empty h3{color:var(--ink);font:800 28px var(--f-display);text-transform:uppercase;margin-bottom:6px}
.empty p{margin:0 auto 18px;max-width:46ch}

/* Sheets */
.overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:linear-gradient(180deg,var(--glass-strong),var(--glass-strong));width:min(980px,100%);max-height:100%;border-radius:30px;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 1px 0 var(--glass-spec),var(--shadow);animation:rise .28s cubic-bezier(.2,.9,.3,1.1)}
.sheet.narrow{width:min(560px,100%)}
@keyframes rise{from{transform:translateY(22px) scale(.98);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.tile,.tile img,.btn{transition:none}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 26px;border-bottom:1px solid var(--line)}
.sheet-head h2{font:800 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;flex:1;min-width:0}
.steps{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sheet-body{overflow:auto;padding:24px 26px;flex:1;min-height:0;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 26px;border-top:1px solid var(--line)}
.sheet-foot .left{margin-right:auto}
@media (max-width:759px){
  .overlay{align-items:flex-end;padding:calc(10px + env(safe-area-inset-top,0px)) 0 0}
  .sheet,.sheet.narrow{width:100%;border-radius:30px 30px 0 0;height:100%}
  .sheet-head{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .sheet-head h2{font-size:22px}
  .sheet-body{padding:16px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
  .sheet-foot{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
}

/* Add: photo step */
.drop{border:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent);border-radius:24px;padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--field)}
.drop.over{border-color:var(--brand);background:var(--accent-soft)}
.drop svg{width:44px;height:44px;color:var(--brand)}
.drop h3{font:800 30px/1 var(--f-display);text-transform:uppercase}
.drop p{margin:0;color:var(--muted);max-width:46ch}
.drop .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tips{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tip{background:var(--field);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--muted)}
.tip b{display:block;font:800 16px var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;color:var(--ink)}
.kbd{font:12px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--surface)}

/* Add: editor step */
.ed{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:759px){.ed{grid-template-columns:minmax(0,1fr);gap:14px}
  /* the photo stays in view while you work the controls under it */
  .ed .ed-stage{position:sticky;top:-16px;z-index:3;padding:8px;min-height:0;box-shadow:0 10px 24px rgba(0,0,0,.28)}
  .ed .ed-stage canvas{max-height:34vh}}
.ed-stage{position:relative;overflow:hidden}
.ed-fit{position:absolute;top:12px;right:12px;height:34px;padding:0 14px;font-size:12px;z-index:2}
.linkish{background:none;border:0;padding:0;color:var(--brand-text);font:inherit;text-decoration:underline;cursor:pointer}
.ed-zoom-hint{display:none}
/* Phones and tablets: bigger targets, no zoom-on-focus, thumb-sized footer buttons */
@media (pointer:coarse){
  .ed-zoom-hint{display:block;margin:0}
  .btn{min-height:44px}
  .chip{min-height:40px;padding:10px 16px}
  input,select,textarea{font-size:16px}
  .switch{min-height:40px;align-items:center}
  .seg button{min-height:44px}
  .quick-colors .qc{width:34px;height:34px}
  .stepper .btn{min-width:48px}
}
@media (max-width:759px){
  .sheet-foot{gap:8px}
  .sheet-foot .btn{flex:1 1 auto;justify-content:center}
  .sheet-foot .btn.primary{flex:2 1 auto}
  .sheet-foot .left{margin-right:0}
  .form{gap:12px}
  .lookup-row .btn{flex:1 1 100%;justify-content:center}
}
.ed-stage{display:grid;place-items:center;background:var(--field);border:1px solid var(--line);border-radius:22px;padding:14px;min-height:200px}
.ed-stage canvas{display:block;max-width:100%;max-height:min(62vh,640px);width:auto;height:auto;border-radius:10px;touch-action:none;
  background:repeating-conic-gradient(var(--check) 0 25%,var(--surface) 0 50%) 0 0/18px 18px;cursor:crosshair}
.ed-tools{display:flex;flex-direction:column;gap:16px;min-width:0}
.ed-hint{margin:0;font-size:14px;color:var(--muted);background:var(--field);border:1px solid var(--line);padding:12px 14px;border-radius:14px}
.ed-hint.warn{background:color-mix(in srgb,var(--tape) 30%,transparent);color:var(--ink);border-color:transparent}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:18px;padding:5px;gap:4px}
.seg button{border:0;background:none;border-radius:14px;padding:9px 4px;font:700 13px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px}
.seg button svg{width:20px;height:20px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px var(--glass-shadow)}
.ctl label{display:flex;justify-content:space-between;font:700 13px var(--f-display);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.ctl label span{font:12px var(--f-mono);color:var(--muted);font-weight:400;letter-spacing:0}
.ctl input[type=range]{width:100%;accent-color:var(--brand)}
/* Sliders: a big thumb that's easy to grab, and a track that fills to the value. */
input[type=range]{-webkit-appearance:none;appearance:none;height:32px;background:transparent;cursor:pointer;touch-action:pan-y;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--brand) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:999px;background:var(--brand)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .12s}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.35)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:999px}
.ctl .range-row{display:flex;align-items:center;gap:8px}.ctl .range-row input{flex:1}
.ctl .range-row .btn{min-width:36px;height:36px;padding:0;font-size:18px}
.ctl small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.switch{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.switch input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand);flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* Details form */
.details{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);gap:28px;align-items:start}
@media (max-width:759px){.details{grid-template-columns:minmax(0,1fr);gap:16px}}
.preview{background:repeating-conic-gradient(var(--check) 0 25%,var(--surface) 0 50%) 0 0/18px 18px;border-radius:22px;aspect-ratio:4/5;max-width:100%;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.preview img{width:100%;height:100%;object-fit:contain;padding:6%}
@media (max-width:759px){.preview{aspect-ratio:1/1;max-height:42vh;margin-inline:auto;width:100%}}
.ai{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);margin-top:12px}
.ai[data-state="error"]{background:var(--field);color:var(--muted)}
.ai svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--brand)}
.ai .spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ai .spin{animation:none}}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 14px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font:700 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:10px 13px;min-height:46px;font-size:16px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:76px;resize:vertical}
/* Dropdown menus: always a dark list with light text, in both themes, so options never blend into the page. */
select{color:var(--ink);color-scheme:dark}
select option,select optgroup{background-color:#161412;color:#F5F3EF}
select option:checked{background-color:#FBB03B;color:#1A1203}
select option:disabled{color:#7A756E}
.field input:disabled{color:var(--ink);opacity:.75}
.color-edit{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.color-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 5px;font-size:14px;background:var(--field)}
.color-chip .swatch{width:18px;height:18px}
.color-chip .pct{font:11px var(--f-mono);color:var(--muted)}
.color-chip button{border:0;background:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);padding:0}
.color-chip button svg{width:14px;height:14px}
.color-chip button:hover{background:var(--line)}
.color-chip .cc-main{width:auto;height:auto;border-radius:999px;display:inline-flex;align-items:center;gap:6px;padding:0 2px;color:inherit;font:inherit;cursor:pointer}
.color-chip .cc-main:hover{background:none;text-decoration:underline}
.color-chip.main{border-color:var(--brand)}
.quick-colors .qc[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand);position:relative}
.quick-colors .qc[aria-pressed="true"]::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--f-display);color:#fff;text-shadow:0 0 3px #000}
.color-add{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px dashed color-mix(in srgb,var(--ink) 25%,transparent);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted);cursor:pointer}
.color-add svg{width:14px;height:14px}

.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles .chip{font-size:13px;padding:7px 13px}

/* Item detail + hang tag */
.detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr);gap:28px;align-items:start}
@media (max-width:759px){.detail{grid-template-columns:minmax(0,1fr);gap:16px}}
.detail .tile{aspect-ratio:4/5}
@media (max-width:759px){.detail .tile{aspect-ratio:1/1;max-height:46vh;width:100%}}
.tagcard{position:relative;background:var(--field);border:1px solid var(--line);border-radius:22px;padding:22px 20px 20px}
.tagcard::before{content:"";position:absolute;top:16px;right:18px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}

.perwear{margin-top:16px;display:flex;gap:10px}

.perwear b{display:block;font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.perwear small{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notes{margin:12px 0 0;font-size:15px;white-space:pre-wrap;color:var(--muted)}

/* Outfits */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 18px}
.ocwrap{position:relative;min-width:0}.oc-share{position:absolute;top:10px;right:10px;z-index:2;height:34px;padding:0 12px;font-size:12px;gap:6px}.oc-share svg{width:15px;height:15px}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}
.pick{position:relative;border:2px solid transparent;border-radius:16px;padding:0;background:var(--tile);aspect-ratio:1/1;max-width:100%;overflow:hidden;box-shadow:0 1px 0 var(--line)}

.pick[aria-pressed="true"]{border-color:var(--brand)}

.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:759px){.panels{grid-template-columns:minmax(0,1fr)}}
.panel{border-radius:24px;padding:20px 22px;min-width:0}

.bars{display:flex;flex-direction:column;gap:10px}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.mini{display:flex;flex-direction:column;gap:6px}

.mini button:hover{background:var(--field)}

.mini .v{font:12px var(--f-mono);color:var(--muted)}
.muted{color:var(--muted)}

/* Exact-item finder */
.finder{margin-top:14px;border-radius:20px;padding:16px}
.finder-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.finder-head b{font:800 20px var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.small{font-size:14px;margin:6px 0 0}
.match{margin-top:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.match h4{font:800 24px/1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.meta{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-flex;font:800 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--field);color:var(--ink);border:1px solid var(--line)}
.pill.high{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill.medium{background:var(--tape);color:var(--tape-ink);border-color:transparent}
.pill.low{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font:700 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--field)}
.links a:hover{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.checks{margin:2px 0 0;padding-left:18px;font-size:14px}
a.plink{color:var(--brand-text);font-weight:700;overflow-wrap:anywhere}

/* Recommendations */
.recs-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.recs-head h3{margin:0}
.recs-head .sel{min-height:44px;padding:8px 14px}
.gaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.gaps li{padding:10px 14px;background:var(--field);border:1px solid var(--line);border-radius:14px}
.rec-summary{margin:16px 0 0;max-width:72ch;font-size:17px}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:14px}
.rec{background:var(--field);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.rec h4{font:800 22px/1 var(--f-display);text-transform:uppercase}
.rec p{margin:0;font-size:15px}
.pairs{display:flex;gap:6px;flex-wrap:wrap}
.pairs button{width:46px;height:46px;border:0;border-radius:12px;background:var(--tile);padding:3px;box-shadow:0 1px 0 var(--line)}
.pairs img{width:100%;height:100%;object-fit:contain}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;color:var(--ink);padding:12px 20px;border-radius:999px;font:700 14px var(--f-display);text-transform:uppercase;letter-spacing:.08em;max-width:calc(100% - 32px);text-align:center}
@media (max-width:759px){.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.shoe-fields:not([hidden]){display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 14px}
.detail-tile{border:0;padding:0;width:100%;cursor:pointer;color:inherit;font:inherit}.detail-tile:disabled{cursor:default}
.stepper{display:flex;gap:6px;align-items:center}.stepper input{flex:1;min-width:0;text-align:center}.stepper .btn{min-width:42px;padding:0 10px;font-size:18px}
.quick-colors{display:flex;flex-wrap:wrap;gap:6px;width:100%;margin-top:8px}
.quick-colors .qc{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}.quick-colors .qc:hover{transform:scale(1.1)}
.paste-list textarea{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:inherit;font:inherit;font-size:14px}
.combo-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.combo{display:inline-flex;align-items:center;gap:6px}.combo .swatch{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}.combo .swatch+.swatch{margin-left:-10px}
.combo-row{display:grid;gap:2px;margin-bottom:10px}
.brand-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.lookup{margin-top:14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--field)}
.lookup h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:15px}.lookup h3 svg{width:18px;height:18px}
.lookup-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.lookup-row input{flex:1 1 220px;min-width:0}
.tile.icon img{padding:8%;image-rendering:auto}
.view-seg{display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px}
.view-seg button{padding:8px 14px;border-radius:999px;flex-direction:row}
.dir-chip{display:inline-flex;align-items:center;gap:4px;font:700 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 12px;background:var(--field)}
.dir-chip button{border:0;background:none;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.dir-chip button:hover{background:var(--line);color:var(--danger)}
/* Shop tabs and Find */
.shop-tabs{margin-bottom:18px}
.shop-tabs .chip{font-size:15px;padding:10px 16px}
.dir-links{margin-top:12px;max-height:260px;overflow:auto;padding:2px}
.find-row{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;text-decoration:none;color:var(--ink)}
.find-row:hover{background:var(--field)}
.find-row b{font:800 16px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
/* Wishlist */
.wish-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wish{display:flex;gap:12px;background:var(--field);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.wish .th{width:76px;height:96px;border-radius:12px;background:var(--tile);flex:none;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.wish .th img{width:100%;height:100%;object-fit:contain}
.wish-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
/* Loading screen */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0B0B0C;color:#F5F3EF;transition:opacity .4s ease,visibility .4s}
.splash.out{opacity:0;visibility:hidden}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:18px}
.splash-logo{width:96px;height:96px;object-fit:contain;animation:splash-pop .9s cubic-bezier(.2,.9,.3,1.2) both}
.splash-name{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;animation:splash-fade .8s .15s ease both}
.splash-bar{width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.splash-bar i{display:block;height:100%;width:40%;border-radius:3px;background:#FBB03B;animation:splash-load 1.1s ease-in-out infinite}
@keyframes splash-pop{from{transform:scale(.6) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes splash-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes splash-load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.splash-logo,.splash-name,.splash-bar i{animation:none}.splash{transition:none}}
/* Shop check */
.shop-photo{background:var(--tile);border-radius:18px;aspect-ratio:4/5;max-height:380px;width:100%;display:grid;place-items:center;overflow:hidden;padding:14px;text-align:center;box-shadow:0 1px 0 var(--line)}
.shop-photo img{width:100%;height:100%;object-fit:contain}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.shop-section{margin-top:18px}
.shop-section h4{font:800 18px/1 var(--f-display);text-transform:uppercase;margin:0 0 10px}
.fit{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.looks .card-name{font-size:14px;margin-top:6px}
.budget-amt{display:inline-flex;align-items:center;gap:6px}
.budget-amt input{width:110px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--field);padding:8px 14px}
.loading{padding:60px 0;text-align:center;color:var(--muted);font:700 15px var(--f-display);text-transform:uppercase;letter-spacing:.12em}
</style>

</head>

async function callOpenAI(text,imgs,endpoint){

// The signed-in AI account: OpenRouter routes each request to a capable model (Claude, GPT, Gemini, Grok…) and bills the person's own account.
async function callOpenRouter(text,imgs,opts={}){

    headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+AI.key, 'HTTP-Referer':location.origin, 'X-Title':'Dixon Closet' },
    body:JSON.stringify({ model:AI.modelId, ...(opts.webFetch?{ plugins:[{ id:'web', max_results:5 }] }:{}),
      messages:[{ role:'user', content:[{ type:'text', text }, ...imgs.map(i=>({ type:'image_url', image_url:{ url:`data:${i.media_type};base64,${i.data}` } }))] }] }) })
    .catch(()=>{ throw { code:'upstream_error' }; });
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw { code:r.status===402?'billing':httpCode(r.status,j?.error?.message), message:j?.error?.message };

function parseLoose(text){

    <div><p class="small muted" style="margin:0 0 6px">${clashes.length?'In your outfits, these fight':'What doesn’t work (with colors you own)'}</p>${watch.length?watch.map(([a,b,why])=>`<div class="combo-row">${pair(a,b)}<span class="small muted">${esc(why)}</span></div>`).join(''):'<p class="muted" style="margin:0">Nothing in your closet clashes.</p>'}</div>

  D.name=v('name'); D.category=v('category'); D.materialType=v('materialType'); D.brand=v('brand'); D.size=v('size'); D.material=v('material'); D.care=v('care'); D.notes=$('#f-notes').value.trim();
  D.styleNumber=v('styleNumber'); D.productUrl=urlOK(v('productUrl'));
  D.fit=v('fit'); D.pattern=v('pattern'); D.style=v('style'); D.reference=v('reference');
  for(const k of SHOE_KEYS){ const el=$('#f-'+k); if(el && isShoeItem(D)) D[k]=el.value; }
  if($('#f-sleeve')) D.sleeve=$('#f-sleeve').value;
  D.price = v('price')==='' ? null : Math.max(0,Number(v('price'))||0);
  if($('#f-wears')){ D.wears=Math.max(0,Math.round(Number(v('wears'))||0)); D.lastWorn=/^\d{4}-\d{2}-\d{2}$/.test(v('lastWorn'))?v('lastWorn'):''; }
  D.tags = v('tags').split(',').map(t=>t.trim()).filter(Boolean).slice(0,12);
}

  const tryLoad=src=>new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.referrerPolicy='no-referrer'; i.onload=()=>res(i); i.onerror=rej; i.src=src; });
  const readable=img=>{ const c=document.createElement('canvas'); c.width=c.height=4; const x=c.getContext('2d'); x.drawImage(img,0,0,4,4); x.getImageData(0,0,1,1); return img; };
  try{ return readable(await tryLoad(url)); }catch{}
  return readable(await tryLoad('https://images.weserv.nl/?url='+encodeURIComponent(url.replace(/^https?:\/\//,''))+'&w=1000&output=png'));
}
async function useStoreImage(A,url){
  A.storeImg={ url, state:'loading' }; if(Add===A) renderFinder();
  try{
    const img=await loadStoreImage(url);
    if(img.naturalWidth<120||img.naturalHeight<120) throw new Error('too small');
    const out=autoCut(img); if(!out) throw new Error('empty cut-out');
    if(A.storeImg?.url!==url) return;
    if(!A.ownCut) A.ownCut = A.cut || 'none'; // remember the owner's photo so they can switch back
    A.cut={...out,url:out.canvas.toDataURL('image/png'),fromStore:true};
    if(!A.touched.colors && out.colors?.length) A.data.colors=out.colors;
    A.storeImg.state='used';
  }catch(e){ console.warn('store photo',e); if(A.storeImg?.url===url) A.storeImg.state='failed'; }
  if(Add===A && A.step==='details'){ const pv=$('#overlay .preview img'); if(pv&&A.cut) pv.src=A.cut.url; renderColors(); renderFinder(); }
}

// Fills the form from the match. Never replaces what the owner typed; replaces guesses unless asked to keep them. force=true also replaces guesses' name and brand.
function applyMatch(A,force){
  const M=A.match, D=A.data, T=A.touched, F=A.fromText||(A.fromText={}); if(!M) return 0;
  let n=0; const put=(k,v)=>{ if(v==null||v===''||(Array.isArray(v)&&!v.length)) return; if(T[k]&&!force) return; if(!force && D[k] && !F[k] && !(Array.isArray(D[k])&&!D[k].length)) return; if(JSON.stringify(D[k])===JSON.stringify(v)) return; D[k]=v; F[k]=true; n++; };
  // The title is the product's own name, nothing added; brand, colorway and style number have their own fields.
  put('brand',M.brand); put('name',M.productName); put('styleNumber',M.styleNumber);
  const ref=[M.brand,M.productName,M.line&&!M.productName.includes(M.line)?M.line:''].filter(Boolean).join(' ');
  put('reference',[ref,M.styleNumber&&!ref.includes(M.styleNumber)?'('+M.styleNumber+')':'',M.colorway].filter(Boolean).join(' ').slice(0,160));
  if(M.category && (!T.category||force)){ if(D.category!==M.category){ D.category=M.category; if(!typesFor(M.category).includes(D.subcategory)) D.subcategory=''; n++; } }
  if(M.subcategory && typesFor(D.category).includes(M.subcategory) && (!T.subcategory||force) && D.subcategory!==M.subcategory){ D.subcategory=M.subcategory; n++; }
  for(const k of ['materialType','material','fit','pattern','care','seasons','productUrl']) put(k,M[k]);
  if(M.style && stylesFor(D.category).includes(M.style)) put('style',M.style);
  if(isShoeItem(D)) for(const k of SHOE_KEYS) put(k,M[k]);
  put('rn',M.rn); put('productImg',M.imageUrl); // the store's photo, so the icon can copy its real colors and graphics
  const note=[M.details, M.fitNotes&&('Fit: '+M.fitNotes), M.madeIn&&('Made in '+M.madeIn)].filter(Boolean).join('. ');
  if(note && !T.notes && (!D.notes || F.notes)){ if(D.notes!==note){ D.notes=note; F.notes=true; n++; } }
  // What the match didn't say outright, read from its own words: "Carhartt Detroit Jacket, brown duck" still names a type, a fabric and a color.
  const p=parseDescription([M.brand,M.productName,M.line,M.colorway,M.material,M.details].filter(Boolean).join(', '))||{};
  if(!M.category && p.category && !T.category && !D.subcategory){ D.category=p.category; n++; }
  if(!D.subcategory && !T.subcategory && p.subcategory && typesFor(D.category).includes(p.subcategory)){ D.subcategory=p.subcategory; n++; }
  for(const k of ['materialType','pattern','fit']) if(!M[k]) put(k,p[k]);
  if(isShoeItem(D)){ for(const k of SHOE_KEYS) if(!M[k]) put(k,p[k]); const def=SHOE_DEFAULTS[D.subcategory]||{}; for(const k of SHOE_KEYS) if(!D[k]) put(k,def[k]); }
  if(!M.style && p.style && stylesFor(D.category).includes(p.style)) put('style',p.style);
  if(!(D.colors||[]).length && !T.colors && p.colors?.length){ D.colors=p.colors; n++; }
  // Then the usual for its type, wherever the field is still empty.
  if(!D.materialType && TYPE_MATERIAL[D.subcategory]) put('materialType',TYPE_MATERIAL[D.subcategory]);
  if(!(D.seasons||[]).length) put('seasons',seasonsFor(D));
  if(!D.care && careFor(D.materialType)) put('care',careFor(D.materialType));
  const tags=[...(M.tags||[]), M.line, M.style].filter(Boolean).map(s=>String(s).toLowerCase()).filter((t,i,a)=>a.indexOf(t)===i && !(D.tags||[]).includes(t));
  if(tags.length && !T.tags && (force || !(D.tags||[]).length)){ D.tags=[...(D.tags||[]),...tags].slice(0,8); n++; }
  if(force){ // Using a match fills in everything it knows, down to the price.
    if(M.retailPrice && (D.price==null||D.price==='') && !T.price){ D.price=M.retailPrice; n++; }
    if(!D.pattern && !T.pattern){ D.pattern='Solid'; F.pattern=true; n++; }
  }
  if(M.colorway && !(D.colors||[]).length && !T.colors){ // no photo to measure, so take the color from the colorway's name
    const low=M.colorway.toLowerCase(), hit=Object.keys(DESC_COLORS).sort((a,b)=>b.length-a.length).find(c=>new RegExp('\\b'+reEsc(c)+'\\b').test(low));
    if(hit){ const hex=DESC_COLORS[hit].toUpperCase(); D.colors=[{hex,name:M.colorway,fam:nameColor(hex).fam}]; n++; } }
  if(n && A.step==='details' && Add===A){ fillDetailsForm(); renderColors(); }
  return n;
}
// When each type usually gets worn.
function seasonsFor(D){
  const s=D.subcategory||'', all=['Spring','Summer','Fall','Winter'];
  if(/Shorts|Jorts|Tanks|Sandals|Swim|Short sleeve/.test(s)) return ['Spring','Summer'];
  if(/Puffer|Coats|Beanies|Scarves|Thermal|Turtleneck/.test(s)) return ['Fall','Winter'];
  if(/Sweater|Hoodie|Cardigan|Sweatshirt|Quarter|Fleece|Overshirt|Corduroy|Work jacket|Chore|Boots/.test(s) || D.category==='outerwear') return ['Spring','Fall','Winter'];
  if(/T-shirt|Polo|Button|Long sleeve|Henley|Linen/.test(s)) return ['Spring','Summer','Fall'];
  return D.category ? all : [];
}

function gapChecks(){
  const it=S.items, c=k=>it.filter(i=>i.category===k).length, out=[];
  const core=[['tops','tops'],['bottoms','bottoms'],['shoes','shoes'],['outerwear','a jacket or coat']].filter(([k])=>!c(k)).map(x=>x[1]);
  if(core.length) out.push(`Nothing logged for ${core.join(', ')} yet. Add what you own there before buying, so suggestions don’t duplicate it.`);
  if(c('bottoms') && c('tops')>=c('bottoms')*3) out.push(`${c('tops')} tops for ${c('bottoms')} bottom${c('bottoms')===1?'':'s'}. Another versatile bottom would multiply your outfits the most.`);
  const neutral=it.filter(i=>(i.colors||[])[0] && ['black','grey','white','brown'].includes(i.colors[0].fam) || (i.colors||[])[0]?.name==='Navy').length;
  if(it.length>=6 && neutral/it.length<0.4) out.push('Under 40% of your pieces are neutrals. A neutral layer or two would tie your colors together.');
  if(it.length>=6 && !it.some(i=>(i.seasons||[]).includes('Winter'))) out.push('Nothing is tagged for winter.');
  const idle=it.filter(i=>!i.wears).length; if(idle) out.push(`${idle} piece${idle===1?' hasn’t':'s haven’t'} been worn yet. Try styling ${idle===1?'it':'them'} in an outfit before buying more.`);
  return out.slice(0,4);
}

  }

const normBrand = b => norm(b).replace(/\b(the|co|inc|wip)\b/g,'').replace(/\s+/g,' ').trim();
function brandStats(){
  const own={}, want={};
  for(const i of S.items){ const k=normBrand(i.brand); if(!k) continue; const b=own[k]||(own[k]={key:k,name:i.brand.trim(),n:0,wears:0,spent:0,sizes:[]});
    b.n++; b.wears+=i.wears||0; b.spent+=Number(i.price)||0; if(i.size && !b.sizes.includes(i.size)) b.sizes.push(i.size); }
  for(const w of Wish.list()){ const k=normBrand(w.brand); if(!k) continue; const b=want[k]||(want[k]={key:k,name:w.brand.trim(),n:0,owned:own[k]?.n||0}); b.n++; }
  const owned=Object.values(own).sort((a,b)=>b.n-a.n||b.wears-a.wears);
  return { owned, worn:[...owned].filter(b=>b.wears).sort((a,b)=>b.wears-a.wears), wanted:Object.values(want).sort((a,b)=>b.n-a.n) };
}

// The owner's wishlist lives in its own owner-only collection so the daily Claude check can read and update it.
const Wish = { docs:[], col:null, shared:false, busy:new Set(),
  async init(db,user){ try{ if(!(await user?.isOwner())) return; }catch{ return; }
    this.shared=true; this.col=db.collection('wishlist');
    this.col.onSnapshot(s=>{ this.docs=s.docs.map(d=>({...d.data(),id:d.id})); if(S.view==='shop') render(); },()=>{}); },
  list(){ return (this.shared?this.docs:Store.docs.filter(d=>d.kind==='wish')).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); },
  get(id){ return this.list().find(w=>w.id===id); },
  async put(id,data){ const b=clean({...data}); delete b.id; if(this.shared) await this.col.doc(id).set(b); else await Store.put(id,{...b,kind:'wish'}); },
  async remove(w){ if(this.shared) await this.col.doc(w.id).delete(); else await Store.remove(w); },
};

// A shuffled look is built like getting dressed: maybe a base layer, one shirt or tee, maybe a mid layer, maybe a jacket,
// one bottom, one pair of shoes, maybe an accessory. Every piece must pair with every other (no two long sleeves, no two
// pieces from the same layer, no two pants); colors that work together are favored.
function shuffleIds(){
  const pick=a=>a[Math.floor(Math.random()*a.length)], chosen=[];
  const fits=i=>chosen.every(c=>pairOK(i,c)) && (!chosen.length || colorsGo(i,{colors:chosen.flatMap(c=>c.colors||[])}) || Math.random()<0.3);
  const add=(pool,chance=1)=>{ if(Math.random()>chance) return; const ok=pool.filter(i=>!chosen.includes(i) && fits(i)); if(ok.length) chosen.push(pick(ok)); };
  const lay=l=>S.items.filter(i=>layerOf(i)===l && i.category!=='suits'), by=c=>S.items.filter(i=>i.category===c);
  add(lay(1)); if(!chosen.length) add(lay(2));            // the main top: a shirt or tee (or a sweater if that's all there is)
  add(lay(0),0.25);                                        // a base layer under it, now and then
  if(chosen.some(i=>layerOf(i)===1)) add(lay(2),0.45);    // a sweater, hoodie or flannel over it
  add(lay(3),0.55);                                        // a jacket or coat
  add(by('bottoms')); add(by('shoes')); add(by('accessories'),0.6);
  return chosen.map(i=>i.id);
}

/* ---------- Share a look as an image ---------- */
function roundRect(x,X,y,w,h,r){ x.beginPath(); x.moveTo(X+r,y); x.arcTo(X+w,y,X+w,y+h,r); x.arcTo(X+w,y+h,X,y+h,r); x.arcTo(X,y+h,X,y,r); x.arcTo(X,y,X+w,y,r); x.closePath(); }
async function lookImage(title,items){
  const W=1080,H=1350,P=64; const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  try{ await Promise.all(['800 80px Advercase','500 30px Advercase'].map(f=>document.fonts.load(f))); }catch{}
  const g=x.createRadialGradient(140,-80,40,140,-80,1100); g.addColorStop(0,'#FDE1AE'); g.addColorStop(1,'#F3F1ED');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  const logo=$('.brand .logo'); if(logo?.complete){ try{ x.drawImage(logo,P,P,56,56); }catch{} }
  x.fillStyle='#0B0B0C'; x.font='800 30px Advercase, "Barlow Condensed", sans-serif'; x.textBaseline='middle'; x.fillText('DIXON CLOSET',P+72,P+30);
  x.font='800 80px Advercase, "Barlow Condensed", sans-serif'; x.textBaseline='alphabetic';
  let t=(title||'Outfit').toUpperCase(); while(x.measureText(t).width>W-2*P && t.length>4) t=t.slice(0,-2)+'…';
  x.fillText(t,P,P+170);
  const n=Math.max(1,items.length), cols=n===1?1:n<=4?2:3, rows=Math.ceil(n/cols), top=P+210, listH=Math.min(items.length,6)*44+40;
  const gap=18, cw=(W-2*P-gap*(cols-1))/cols, ch=Math.min(cw*1.15,(H-top-listH-P-gap*(rows-1))/rows);
  // Uniform icons when that's how the closet is shown; otherwise the photos (fetched first in the Claude version, where they load on demand).
  if(!S.iconView && Store.mode==='linked'){ items.forEach(i=>Linked.img(i)); await Linked.loadImgs(); }
  const imgs=await Promise.all(items.map(i=>(S.iconView?makeIcon(i):Promise.resolve(Store.imgSrc(i))).then(loadImg).catch(()=>null)));
  items.forEach((it,k)=>{ const cx=P+(k%cols)*(cw+gap), cy=top+Math.floor(k/cols)*(ch+gap);
    x.fillStyle='#FFFFFF'; roundRect(x,cx,cy,cw,ch,26); x.fill();
    const im=imgs[k]; if(!im) return; const iw=im.naturalWidth||im.width||200, ih=im.naturalHeight||im.height||240, pad=0.1;
    const s=Math.min(cw*(1-2*pad)/iw, ch*(1-2*pad)/ih); const dw=iw*s, dh=ih*s;
    try{ x.drawImage(im,cx+(cw-dw)/2,cy+(ch-dh)/2,dw,dh); }catch{} });
  let ly=top+rows*ch+(rows-1)*gap+56; x.font='500 30px Advercase, Barlow, sans-serif';
  items.slice(0,6).forEach(it=>{ const line=[it.name||catLabel(it.category),it.brand].filter(Boolean).join('  ·  ');
    x.fillStyle='#FBB03B'; x.beginPath(); x.arc(P+8,ly-10,7,0,7); x.fill(); x.fillStyle='#0B0B0C'; x.fillText(line,P+30,ly); ly+=44; });
  return canvasBlob(cv,'image/png');
}
// For shoes: how your pairs fit, same brand first, so a new pair can be sized against them.
function shoeFitNote(item){
  const cat=item?.category||P.category; if(cat!=='shoes' && !(cat==='suits'&&item?.subcategory==='Dress shoes')) return '';
  const mine=S.items.filter(isShoeItem); if(!mine.length) return '';
  const brand=normBrand(item.brand), same=brand?mine.filter(i=>normBrand(i.brand)===brand):[];
  const top=(arr,k)=>{ const c={}; arr.forEach(i=>{ if(i[k]) c[i[k]]=(c[i[k]]||0)+1; }); return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||''; };
  const pool=same.length?same:mine, size=top(pool,'size'), width=top(pool,'shoeWidth'), feel=top(pool,'shoeFit');
  const bits=[size&&`size ${size}`, width&&width!=='Regular'&&`${width.toLowerCase()} width`, feel&&feel!=='True to size'&&`fit: ${feel.toLowerCase()}`].filter(Boolean);
  return bits.length?` <b>${same.length?`Your ${esc(same[0].brand)} shoes`:'Your shoes'}: ${esc(bits.join(', '))}</b>${same.length?'':` across ${mine.length} pair${mine.length===1?'':'s'}`}.`:'';
}
// The look as text: what each piece is, and where to find it.
function lookText(title,items){
  return [`${title||'My outfit'}, from my Dixon Closet`, ...items.map(i=>`• ${[i.brand,i.name||catLabel(i.category)].filter(Boolean).join(' ')}${i.size?` (${i.size})`:''}${urlOK(i.productUrl)?' — '+i.productUrl:''}`)].join('\n');
}
async function copyLook(title,items){

async function shareLook(btn,title,items){
  if(!items.length){ toast('Nothing to share yet'); return; }
  const label=btn.textContent; btn.disabled=true; btn.textContent='Preparing…';
  const name=`${(title||'outfit').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'outfit'}.png`;
  try{
    const blob=await lookImage(title,items); const file=new File([blob],name,{type:'image/png'});
    let shared=false;
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:title||'Outfit',text:lookText(title,items)}); shared=true; }
      catch(e){ if(e?.name==='AbortError') shared=true; }
    }
    if(!shared){
      if(Store.downloads){ await Store.downloads.save({filename:name,data:blob}); toast('Image saved. Send it to your friends.'); }
      else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); toast('Image saved. Send it to your friends.'); }
    }
  }catch(e){ if(e?.code!=='declined') toast('Couldn’t make the image. Try again.'); }
  btn.disabled=false; btn.textContent=label;
}

    const docs=[]; let missing=0;

      if(c.imgId){ try{ const r=await fetch('/_blob/'+c.imgId); if(!r.ok) throw new Error(r.status); c.imgData=await blobToDataURL(await r.blob()); delete c.imgId; }catch{ missing++; } }
      docs.push(c); }
    const data=JSON.stringify({app:'dixon-closet',version:1,exportedAt:new Date().toISOString(),docs});
    await dl.save({filename:`dixon-closet-backup-${today()}.json`, data:new Blob([data],{type:'application/json'})});

  }catch(e){ if(e?.code!=='declined') toast(e?.code==='too_large'?'The backup is too large to save here.':'Couldn’t save the backup. Try again.'); }

  'select-delete':t=>armDelete(t,async()=>{ const ids=[...S.sel]; t.disabled=true;
    try{ for(const id of ids){ const it=Store.get(id); if(it) await Store.remove(it); }
      for(const o of Store.docs.filter(d=>d.kind==='outfit'&&(d.itemIds||[]).some(x=>S.sel.has(x)))) await Store.patch(o.id,{itemIds:o.itemIds.filter(x=>!S.sel.has(x))});
      toast(`Deleted ${ids.length} piece${ids.length===1?'':'s'}`); }
    catch{ toast('Some pieces couldn’t be deleted. Try again.'); }
    S.selecting=false; S.sel=new Set(); render(); }),
  'edit-item':t=>editItem(t.dataset.id),
  'wear-item':async t=>{ const it=Store.get(t.dataset.id); if(!it) return; t.disabled=true; try{ await Store.patch(it.id,{wears:(it.wears||0)+1,lastWorn:today()}); toast('Logged a wear'); }catch{ toast('Couldn’t log that wear. Try again.'); t.disabled=false; } },
  'del-item':t=>armDelete(t,async()=>{ const it=Store.get(t.dataset.id); if(!it) return; try{ await Store.remove(it);
      for(const o of Store.docs.filter(d=>d.kind==='outfit'&&(d.itemIds||[]).includes(it.id))) await Store.patch(o.id,{itemIds:o.itemIds.filter(x=>x!==it.id)});
      closeSheet(); toast('Deleted'); }catch{ toast('Couldn’t delete that piece. Try again.'); } }),
  'outfit-with':t=>{ const id=t.dataset.id; closeSheet(); openBuilder({ids:[id]}); },
  'pick-photo':()=>{ const f=$('#photo-file'); f.value=''; f.click(); },
  'replace-photo':()=>{ readForm(); const f=$('#photo-file'); f.value=''; f.click(); },
  'scan-label':()=>{ const f=$('#label-file'); f.value=''; f.click(); },
  'ai-identify':()=>aiIdentify(),
  backup:t=>exportBackup(t),
  'find-exact':()=>findExact(),
  'find-item':t=>editItem(t.dataset.id,{find:true}),
  'use-match':()=>{ readForm(); const M=Add.match; if(!M) return; const n=applyMatch(Add,true); Add.matchFilled=(Add.matchFilled||0)+n;
    if(M.imageUrl && !Add.cut?.fromStore && Add.storeImg?.state!=='loading') useStoreImage(Add,M.imageUrl);
    if(!M.productUrl && !Add.data.productUrl && M.queries?.[0] && !(Add.data.notes||'').includes(M.queries[0])) Add.data.notes=[Add.data.notes,'Search: '+M.queries[0]].filter(Boolean).join('\n');
    renderDetailsStep(); toast(n?`Filled in ${n} detail${n===1?'':'s'} from the match.`:'Everything from the match is already filled in.'); },
  'get-recs':()=>getRecs(),
  'ed-tool':t=>{ Ed.tool=t.dataset.v; document.querySelectorAll('[data-act="ed-tool"]').forEach(b=>b.setAttribute('aria-pressed',b===t)); edDraw(); },
  'ed-undo':()=>{ const u=Ed.undo.pop(); if(u){ Ed.edits=u; edDraw(); } },
  'ed-reset':()=>{ edPushUndo(); Ed.edits=new Int8Array(Ed.n); edDraw(); },
  'ed-back':()=>{ if(Add.editingId){ renderDetailsStep(); return; } Add.step='photo'; renderPhotoStep(); },
  'ed-next':()=>{ const out=edExport(); if(!out){ toast('Nothing is left in the cut-out. Restore some of the piece first.'); return; }
    if(Add.cut?.url) URL.revokeObjectURL(Add.cut.url);
    Add.cut={...out,url:out.canvas.toDataURL('image/png')};
    if(!Add.touched.colors) Add.data.colors=out.colors;
    const first=!Add.identified && !Add.editingId; Add.step='details'; renderDetailsStep(); if(Add.hint) applyDescription(Add.hint);
    if(first && (isBasic() || AI.images)){ Add.identified=true; aiIdentify(); } },
  'det-back':()=>{ readForm(); Add.step='edit'; renderEditStep(); edDraw(); },
  'lookup-go':()=>lookupGo(),
  'paste-add':t=>pasteAdd(t),
  'save-today':async t=>{ const ids=S.items.filter(i=>i.lastWorn===today()).map(i=>i.id);
    if(ids.length<2){ toast('Log at least two pieces with “Wore it today” first.'); return; }
    t.disabled=true; try{ await Store.put(Store.newId(),{kind:'outfit',name:'Look from '+new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'}),itemIds:ids,wears:1,lastWorn:today(),createdAt:Date.now()}); toast('Saved today’s look'); }
    catch{ t.disabled=false; toast('Couldn’t save the look. Try again.'); } },
  'photo-mine':()=>{ const S0=Add.storeCut=Add.cut; Add.cut=Add.ownCut==='none'?null:Add.ownCut; Add.ownCut=null; Add.swapBack=S0;
    if(!Add.cut && Add.lookup) Add.data.imgData=lookupImage(Add.data); renderDetailsStep(); },
  'photo-store':()=>{ if(!Add.swapBack) return; Add.ownCut=Add.cut||'none'; Add.cut=Add.swapBack; Add.swapBack=null; renderDetailsStep(); },
  'lookup-back':()=>{ const q=Add.hint||''; Add={ step:'photo', editingId:null, data:{category:'tops',colors:[],seasons:[],tags:[]}, cut:null, touched:{} }; renderPhotoStep(); $('#lookup-q').value=q; },
  'ed-auto':()=>{ const r=$('#ed-tol'); if(!r||!Ed) return; r.value=Ed.autoT; r.dispatchEvent(new Event('input',{bubbles:true})); },
  'detail-flip':t=>{ S.detailPhoto = S.detailPhoto===t.dataset.id ? null : t.dataset.id; refreshOpenSheet(); },
  'range-step':t=>{ const r=$('#'+t.dataset.for); if(!r||r.disabled) return; r.value=Math.min(+r.max,Math.max(+r.min,(+r.value)+Number(t.dataset.d))); r.dispatchEvent(new Event('input',{bubbles:true})); },
  'wears-step':t=>{ const i=$('#f-wears'); const n=Math.max(0,(Number(i.value)||0)+Number(t.dataset.d)); i.value=n;
    if(Number(t.dataset.d)>0 && !$('#f-lastWorn').value) $('#f-lastWorn').value=today(); },
  // Pick several: the first tap replaces the photo's guess, each tap after adds one, a second tap on a color removes it.
  'color-quick':t=>{ readForm(); const n=t.dataset.n, hex=DESC_COLORS[n].toUpperCase(), name=n.replace(/\b\w/g,m=>m.toUpperCase());
    const cur=Add.data.colors||[], at=cur.findIndex(x=>x.name.toLowerCase()===n);
    if(at>=0) cur.splice(at,1);
    else { const c={hex,name,fam:nameColor(hex).fam}; Add.data.colors = Add.touched.colors ? [...cur,c].slice(0,6) : [c]; }
    Add.touched.colors=true; renderColors(); refreshLookupImage(); },
  'color-main':t=>{ readForm(); const i=+t.dataset.i, cur=Add.data.colors||[]; if(i>0 && cur[i]){ const [c]=cur.splice(i,1); cur.unshift(c); Add.touched.colors=true; renderColors(); refreshLookupImage(); } },
  'color-rm':t=>{ readForm(); Add.touched.colors=true; Add.data.colors.splice(+t.dataset.i,1); renderColors(); },
  season:t=>{ const s=t.dataset.v, a=Add.data.seasons||(Add.data.seasons=[]); const i=a.indexOf(s); i>=0?a.splice(i,1):a.push(s); t.setAttribute('aria-pressed',i<0); },
  'save-item':()=>saveItem(),
  'new-outfit':()=>openBuilder(),
  shuffle:()=>{ const ids=shuffleIds(); if(!ids.length){ toast('Add a few pieces first'); return; } openBuilder({ids}); },
  'shuffle-in':()=>{ B.ids=shuffleIds(); B.draw(); },
  'b-cat':t=>{ B.cat=t.dataset.v; B.draw(); },
  'b-pick':t=>{ const id=t.dataset.id, i=B.ids.indexOf(id); i>=0?B.ids.splice(i,1):B.ids.push(id); t.setAttribute('aria-pressed',i<0); $('#b-board').innerHTML=boardHTML(B.ids); },
  'b-save':async t=>{ if(!B.ids.length){ toast('Pick at least one piece'); return; } t.disabled=true; t.textContent='Saving…';
    try{ const id=B.editingId||Store.newId(), prev=B.editingId?Store.get(id):null;
      await Store.put(id,{kind:'outfit',name:B.name.trim()||'Untitled outfit',itemIds:B.ids,wears:prev?.wears||0,lastWorn:prev?.lastWorn||'',createdAt:prev?.createdAt||Date.now()});
      closeSheet(); S.view='outfits'; render(); showOutfit(id); toast('Outfit saved. Tap Share to send it.'); }
    catch{ t.disabled=false; t.textContent='Save outfit'; toast('Couldn’t save the outfit. Try again.'); } },
  'open-outfit':t=>showOutfit(t.dataset.id),
  'edit-outfit':t=>{ const o=Store.get(t.dataset.id); if(o) openBuilder({ids:o.itemIds||[],name:o.name||'',editingId:o.id}); },
  'wear-outfit':async t=>{ const o=Store.get(t.dataset.id); if(!o) return; t.disabled=true; const d=today();
    try{ await Store.patch(o.id,{wears:(o.wears||0)+1,lastWorn:d}); for(const iid of o.itemIds||[]){ const it=Store.get(iid); if(it) await Store.patch(iid,{wears:(it.wears||0)+1,lastWorn:d}); } toast('Logged the outfit and each piece'); }
    catch{ t.disabled=false; toast('Couldn’t log that wear. Try again.'); } },
  'del-outfit':t=>armDelete(t,async()=>{ const o=Store.get(t.dataset.id); if(!o) return; try{ await Store.remove(o); closeSheet(); toast('Deleted'); }catch{ toast('Couldn’t delete that outfit.'); } }),
};
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t||t.disabled) return; const fn=ACT[t.dataset.act]; if(fn){ e.preventDefault(); fn(t,e); } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.id==='type-new-name'){ e.preventDefault(); ACT['type-add'](); }
  if(e.key==='Enter' && e.target.id==='dir-new'){ e.preventDefault(); ACT['dir-add'](); } });

// A slider's track fills up to its value.
function fillRange(r){ const p=(r.value-r.min)/((r.max-r.min)||1)*100; r.style.setProperty('--p',p+'%'); }
document.addEventListener('input',e=>{ if(e.target.type==='range') fillRange(e.target); });
// Each chip row keeps its place when the screen redraws, so picking a chip doesn't snap the row back to the start.
const chipKey = c => c.getAttribute('aria-label') || c.parentElement?.id || '';
const chipScroll=new Map();
document.addEventListener('scroll',e=>{ const c=e.target; if(c.classList?.contains('chips') && chipKey(c)) chipScroll.set(chipKey(c),c.scrollLeft); },true);
new MutationObserver(()=>{ document.querySelectorAll('.chips:not([data-kept])').forEach(c=>{ c.dataset.kept='1'; const v=chipScroll.get(chipKey(c)); if(v) c.scrollLeft=v; }); }).observe(document.body,{childList:true,subtree:true});
// Center a chip in its row without moving the page.
function centerChip(chip){ const row=chip?.closest('.chips'); if(!row) return; row.scrollTo({left:Math.max(0,chip.offsetLeft-(row.clientWidth-chip.offsetWidth)/2),behavior:'smooth'}); }
/* Swipeable chip rows: fade the edge that has more, let a mouse drag or wheel scroll them sideways. */
function updateChipFades(){ document.querySelectorAll('.chips').forEach(c=>{ const more=c.scrollWidth-c.clientWidth;
  c.classList.toggle('fade-l', c.scrollLeft>2); c.classList.toggle('fade-r', more>2 && c.scrollLeft<more-2); }); }
let fadeRAF=0; const queueFades=()=>{ if(!fadeRAF) fadeRAF=requestAnimationFrame(()=>{ fadeRAF=0; updateChipFades(); }); };
new MutationObserver(queueFades).observe(document.body,{childList:true,subtree:true});
document.addEventListener('scroll',e=>{ if(e.target.classList?.contains('chips')) queueFades(); },true);
window.addEventListener('resize',queueFades);
let chipDrag=null;
document.addEventListener('pointerdown',e=>{ const c=e.target.closest?.('.chips'); if(c && e.pointerType==='mouse') chipDrag={c,x:e.clientX,left:c.scrollLeft,moved:false}; });
document.addEventListener('pointermove',e=>{ if(!chipDrag) return; const dx=e.clientX-chipDrag.x, now=performance.now();
  if(!chipDrag.moved && Math.abs(dx)>6){ chipDrag.moved=true; chipDrag.c.classList.add('dragging'); }
  if(chipDrag.moved){ chipDrag.v=(e.clientX-(chipDrag.lx??e.clientX))/Math.max(1,now-(chipDrag.lt??now)); chipDrag.lx=e.clientX; chipDrag.lt=now; chipDrag.c.scrollLeft=chipDrag.left-dx; } });
document.addEventListener('pointerup',()=>{ if(chipDrag?.moved){ const c=chipDrag.c; c.classList.remove('dragging');
  // Let go mid-swipe and the row glides to a stop, like a touch swipe.
  let v=(chipDrag.v||0)*16; const glide=()=>{ if(Math.abs(v)<.5) return; c.scrollLeft-=v; v*=.92; requestAnimationFrame(glide); }; requestAnimationFrame(glide);
  const stop=ev=>{ ev.stopPropagation(); ev.preventDefault(); }; c.addEventListener('click',stop,{capture:true,once:true}); setTimeout(()=>c.removeEventListener('click',stop,{capture:true}),60); }
  chipDrag=null; });
document.addEventListener('wheel',e=>{ const c=e.target.closest?.('.chips'); if(!c || Math.abs(e.deltaX)>Math.abs(e.deltaY) || c.scrollWidth<=c.clientWidth) return;
  c.scrollLeft+=e.deltaY; e.preventDefault(); },{passive:false});

document.addEventListener('input',e=>{ const id=e.target.id;
  if(id==='q'){ S.q=e.target.value; S._focusQ=true; render(); }
  else if(id.startsWith('p-')) P[id.slice(2)]=e.target.value;
  else if(id.startsWith('f2-')) F[id.slice(3)]=e.target.value;
  else if(id==='rec-budget-amt'){ S.budgetAmt=e.target.value; queueBudgetSave(); } });
document.addEventListener('change',e=>{ const id=e.target.id;
  if(id==='sort'){ S.sort=e.target.value; render(); }
  else if(id==='rec-focus') S.recFocus=e.target.value;
  else if(id==='p-category'){ P.category=e.target.value; }
  else if(id==='f2-category'){ F.category=e.target.value; }
  else if(id==='idle-days'){ S.idleDays=Number(e.target.value)||60; render(); }
  else if(id==='rec-budget'){ S.recBudget=e.target.value; savePrefs(); render(); if(S.recBudget==='custom') $('#rec-budget-amt')?.focus(); } });

$('#photo-file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return;
  if(!Add){ startAdd(f); return; }
  if(Add.editingId) Add.identified=true; // replacing a photo on an existing piece keeps your details
  loadPhoto(f); });
$('#label-file').addEventListener('change',e=>{ const f=e.target.files[0]; if(f && Add) aiLabel(f); });
['shop-file','shop-camera-file'].forEach(id=>$('#'+id).addEventListener('change',e=>{ const f=e.target.files[0]; if(f) shopSetFile(f); }));
document.addEventListener('paste',e=>{
  const f=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'))?.getAsFile(); if(!f) return;
  if(sheetKind==='add' && Add && Add.step!=='details'){ e.preventDefault(); loadPhoto(f); }
  else if(!sheetKind){ e.preventDefault(); S.view==='shop' ? shopSetFile(f) : startAdd(f); }
});
document.addEventListener('dragover',e=>{ if(!sheetKind && [...(e.dataTransfer?.items||[])].some(i=>i.kind==='file')) e.preventDefault(); });
document.addEventListener('drop',e=>{ if(sheetKind) return; const f=[...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith('image/')); if(f){ e.preventDefault(); startAdd(f); } });

AI.load();
Store.init().catch(e=>{ console.error(e); Store.initLocal(); });
</script>
<script src="app-extras.js"></script>
<script src="sync-config.js"></script>
<script src="app-sync.js"></script>
</body>
